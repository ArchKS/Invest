<svg role="img" width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>Venetoclax and Lisaftoclax molecular structure comparison</title>
  <desc>Side-by-side comparison highlighting two key structural differences: Site 1 (dimethyl vs cyclobutyl spiro) and Site 2 (THP vs 1,4-dioxane)</desc>

  <defs>
    <style>
      .title { font: 500 15px 'Inter', sans-serif; fill: #3C3489; }
      .subtitle { font: 500 13px 'Inter', sans-serif; fill: #5F5E5A; }
      .label { font: 400 11px 'Inter', sans-serif; fill: #5F5E5A; }
      .domain-label { font: 500 12px 'Inter', sans-serif; fill: #26215C; }
      .domain-sub { font: 400 10px 'Inter', sans-serif; fill: #888780; }
      .highlight-label { font: 500 11px 'Inter', sans-serif; }
      .diff-label { font: 500 12px 'Inter', sans-serif; fill: #993C1D; }
      .diff-sub { font: 400 10px 'Inter', sans-serif; fill: #D85A30; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background grid lines -->
  <rect x="0" y="0" width="680" height="680" fill="transparent"/>

  <!-- Titles -->
  <text class="title" x="340" y="28" text-anchor="middle">Venetoclax 与 Lisaftoclax 分子结构对比</text>
  <text class="subtitle" x="340" y="48" text-anchor="middle">两处关键结构位点差异决定差异化药理特性</text>

  <!-- Divider line -->
  <line x1="340" y1="62" x2="340" y2="650" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- ==================== VENETOCLAX (LEFT) ==================== -->
  <text class="domain-label" x="170" y="76" text-anchor="middle" fill="#534AB7">Venetoclax (ABT-199)</text>
  <text class="domain-sub" x="170" y="90" text-anchor="middle">C₄₅H₅₀ClN₇O₇S · MW 868.4</text>

  <!-- Pharmacophore domain boxes for Venetoclax -->

  <!-- 1. Chlorophenyl -->
  <rect x="40" y="105" width="62" height="38" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="71" y="120" text-anchor="middle">Cl</text>
  <text class="label" x="71" y="134" text-anchor="middle">苯环</text>

  <!-- Connector -->
  <line x1="102" y1="124" x2="130" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 2. Site 1: Dimethylcyclohexene (HIGHLIGHTED) -->
  <rect x="130" y="100" width="86" height="48" rx="6" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1"/>
  <rect x="132" y="102" width="82" height="44" rx="4" fill="none" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text class="highlight-label" fill="#993556" x="173" y="116" text-anchor="middle">位点 1</text>
  <text class="label" fill="#72243E" x="173" y="132" text-anchor="middle">二甲基环己烯</text>
  <text class="domain-sub" x="173" y="144" text-anchor="middle">4,4-dimethyl</text>

  <!-- Highlight callout for Site 1 -->
  <line x1="173" y1="148" x2="173" y2="168" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>
  <rect x="108" y="168" width="130" height="28" rx="4" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="label" fill="#D85A30" x="173" y="178" text-anchor="middle">H₃C— —CH₃</text>
  <text class="domain-sub" fill="#D85A30" x="173" y="190" text-anchor="middle">两个甲基</text>

  <!-- Connector -->
  <line x1="216" y1="124" x2="244" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 3. Piperazine -->
  <rect x="244" y="105" width="64" height="38" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="label" x="276" y="120" text-anchor="middle">哌嗪</text>
  <text class="domain-sub" x="276" y="134" text-anchor="middle">-N N-</text>

  <!-- Connector -->
  <line x1="308" y1="124" x2="336" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 4. Central Phenyl -->
  <rect x="336" y="105" width="62" height="38" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="367" y="124" text-anchor="middle">中心苯环</text>

  <!-- Branch: upward to aza-indole -->
  <line x1="367" y1="105" x2="367" y2="82" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="367" y1="82" x2="367" y2="68" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 5. Aza-indole -->
  <rect x="330" y="50" width="74" height="36" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="label" x="367" y="64" text-anchor="middle">氮杂吲哚</text>
  <text class="domain-sub" x="367" y="78" text-anchor="middle">-O-aza-indole</text>

  <!-- Branch: rightward to benzamide -->
  <line x1="398" y1="124" x2="426" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 6. Benzamide-Sulfonamide -->
  <rect x="426" y="100" width="84" height="48" rx="6" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text class="label" x="468" y="116" text-anchor="middle">苯甲酰胺</text>
  <text class="label" x="468" y="130" text-anchor="middle">磺酰胺</text>
  <text class="domain-sub" x="468" y="143" text-anchor="middle">-C(=O)NH-SO₂-</text>

  <!-- Connector -->
  <line x1="510" y1="124" x2="538" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 7. Nitro-phenyl -->
  <rect x="538" y="105" width="62" height="38" rx="6" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="label" x="569" y="120" text-anchor="middle">NO₂-苯环</text>
  <text class="domain-sub" x="569" y="134" text-anchor="middle">-NH-</text>

  <!-- Connector -->
  <line x1="600" y1="124" x2="620" y2="124" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 8. Site 2: THP (HIGHLIGHTED) -->
  <rect x="620" y="100" width="50" height="48" rx="6" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1"/>
  <rect x="622" y="102" width="46" height="44" rx="4" fill="none" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text class="highlight-label" fill="#993556" x="645" y="118" text-anchor="middle">位点 2</text>
  <text class="label" fill="#72243E" x="645" y="134" text-anchor="middle">THP</text>
  <text class="domain-sub" x="645" y="145" text-anchor="middle">四氢吡喃</text>


  <!-- ==================== LISAFTOCLAX (RIGHT) ==================== -->

  <!-- Title for right half at y=205 -->
  <text class="domain-label" x="510" y="246" text-anchor="middle" fill="#D85A30">Lisaftoclax (APG-2575)</text>
  <text class="domain-sub" x="510" y="260" text-anchor="middle">C₄₅H₄₈ClN₇O₈S · MW 882.4</text>

  <!-- 1. Chlorophenyl -->
  <rect x="40" y="278" width="62" height="38" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="71" y="293" text-anchor="middle">Cl</text>
  <text class="label" x="71" y="307" text-anchor="middle">苯环</text>

  <!-- Connector -->
  <line x1="102" y1="297" x2="130" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 2. Site 1: Spiro[cyclohexene-cyclobutane] (HIGHLIGHTED) -->
  <rect x="130" y="268" width="104" height="58" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="1.5"/>
  <rect x="133" y="271" width="98" height="52" rx="4" fill="none" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text class="diff-label" x="182" y="286" text-anchor="middle">位点 1 修改</text>
  <text class="label" fill="#72243E" x="182" y="302" text-anchor="middle">螺[环己烯-环丁烷]</text>
  <text class="diff-sub" x="182" y="318" text-anchor="middle">spiro[3.5]non-7-ene</text>

  <!-- Highlight callout for Site 1 -->
  <line x1="182" y1="326" x2="182" y2="350" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>
  <rect x="108" y="350" width="148" height="32" rx="4" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="diff-label" x="182" y="362" text-anchor="middle">甲基 → 环丁基</text>
  <text class="diff-sub" x="182" y="376" text-anchor="middle">(-CH₃)₂ → spiro-C₄H₈</text>

  <!-- Connector -->
  <line x1="234" y1="297" x2="244" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 3. Piperazine -->
  <rect x="244" y="278" width="64" height="38" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="label" x="276" y="293" text-anchor="middle">哌嗪</text>
  <text class="domain-sub" x="276" y="307" text-anchor="middle">-N N-</text>

  <!-- Connector -->
  <line x1="308" y1="297" x2="336" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 4. Central Phenyl -->
  <rect x="336" y="278" width="62" height="38" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="367" y="297" text-anchor="middle">中心苯环</text>

  <!-- Branch: upward to aza-indole -->
  <line x1="367" y1="278" x2="367" y2="256" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="367" y1="256" x2="367" y2="242" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 5. Aza-indole -->
  <rect x="330" y="224" width="74" height="36" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="label" x="367" y="238" text-anchor="middle">氮杂吲哚</text>
  <text class="domain-sub" x="367" y="252" text-anchor="middle">-O-aza-indole</text>

  <!-- Branch: rightward -->
  <line x1="398" y1="297" x2="426" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 6. Benzamide-Sulfonamide -->
  <rect x="426" y="273" width="84" height="48" rx="6" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text class="label" x="468" y="289" text-anchor="middle">苯甲酰胺</text>
  <text class="label" x="468" y="303" text-anchor="middle">磺酰胺</text>
  <text class="domain-sub" x="468" y="316" text-anchor="middle">-C(=O)NH-SO₂-</text>

  <!-- Connector -->
  <line x1="510" y1="297" x2="538" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 7. Nitro-phenyl -->
  <rect x="538" y="278" width="62" height="38" rx="6" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="label" x="569" y="293" text-anchor="middle">NO₂-苯环</text>
  <text class="domain-sub" x="569" y="307" text-anchor="middle">-NH-</text>

  <!-- Connector -->
  <line x1="600" y1="297" x2="622" y2="297" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- 8. Site 2: 1,4-Dioxane (HIGHLIGHTED) -->
  <rect x="622" y="268" width="48" height="58" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="1.5"/>
  <rect x="624" y="271" width="44" height="52" rx="4" fill="none" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text class="diff-label" x="646" y="286" text-anchor="middle">位点2</text>
  <text class="diff-label" x="646" y="300" text-anchor="middle">修改</text>
  <text class="label" fill="#72243E" x="646" y="316" text-anchor="middle">二恶烷</text>
  <text class="diff-sub" x="646" y="324" text-anchor="middle">(S)-dioxane</text>

  <!-- ==================== SITE 1 ANNOTATION ==================== -->
  <line x1="173" y1="196" x2="173" y2="210" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="173" y1="210" x2="340" y2="210" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="340" y1="210" x2="340" y2="223" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Site 1 annotation box -->
  <rect x="240" y="205" width="200" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="diff-label" x="340" y="220" text-anchor="middle">位点 1: 二甲基 → 环丁基螺环</text>
  <text class="diff-sub" x="340" y="234" text-anchor="middle">改变环己烯环的构象柔性和空间位阻</text>

  <!-- Arrow from Site 1 annotation to Lisaftoclax Site 1 -->
  <line x1="340" y1="241" x2="340" y2="258" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="340" y1="258" x2="182" y2="258" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="182" y1="258" x2="182" y2="268" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- ==================== SITE 2 ANNOTATION ==================== -->
  <!-- Annotation arrow from Venetoclax site 2 -->
  <line x1="645" y1="148" x2="645" y2="160" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="645" y1="160" x2="340" y2="160" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="340" y1="160" x2="340" y2="172" stroke="#D4537E" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Site 2 annotation box (upper) -->
  <rect x="240" y="155" width="200" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="diff-label" x="340" y="170" text-anchor="middle">位点 2: 四氢吡喃 → 1,4-二恶烷</text>
  <text class="diff-sub" x="340" y="184" text-anchor="middle">引入第二个氧原子, 增强极性</text>

  <!-- Arrow from Site 2 annotation to Lisaftoclax Site 2 -->
  <line x1="340" y1="191" x2="340" y2="208" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="340" y1="208" x2="646" y2="208" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="646" y1="208" x2="646" y2="268" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- ==================== KEY BOTTOM LEGEND ==================== -->
  <rect x="80" y="410" width="520" height="100" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>

  <text class="domain-label" x="340" y="432" text-anchor="middle">结构差异的药理后果</text>

  <rect x="100" y="445" width="12" height="12" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="label" x="118" y="455" text-anchor="start">位点 1 (环丁基螺环): 改变 BCL-2 疏水槽结合构象, 可能影响对 VEN 耐药突变 (G101V) 的结合</text>

  <rect x="100" y="468" width="12" height="12" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="label" x="118" y="478" text-anchor="start">位点 2 (1,4-二恶烷): 增加极性/溶解度, 改变代谢途径, 可能与短半衰期 (4-6h) 相关</text>

  <rect x="100" y="491" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="118" y="501" text-anchor="start">其余结构: 氯苯基、哌嗪、中心苯环、氮杂吲哚、苯甲酰胺-磺酰胺-NO₂苯环 → 完全一致</text>


  <!-- ==================== RING STRUCTURE DIAGRAMS ==================== -->

  <!-- THP ring structure -->
  <g transform="translate(60, 540)">
    <text class="domain-sub" x="40" y="0" text-anchor="middle" fill="#534AB7">四氢吡喃 (THP)</text>
    <polygon points="0,25 15,12 45,12 60,25 45,38 15,38" fill="#F1EFE8" stroke="#534AB7" stroke-width="0.5"/>
    <circle cx="0" cy="25" r="3" fill="#E24B4A"/>
    <text class="label" fill="#E24B4A" x="-5" y="46" text-anchor="middle">O</text>
    <!-- Attachment point -->
    <line x1="60" y1="25" x2="72" y2="25" stroke="#534AB7" stroke-width="0.5"/>
    <text class="domain-sub" x="82" y="28" text-anchor="start" fill="#534AB7">-CH₂-</text>
    <text class="domain-sub" x="40" y="58" text-anchor="middle" fill="#888780">6元环, 1个O</text>
    <text class="domain-sub" x="40" y="72" text-anchor="middle" fill="#888780">连接在 C4 位</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(280, 565)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow-right)"/>
    <text class="diff-sub" x="25" y="-8" text-anchor="middle">位点2修改</text>
  </g>

  <!-- 1,4-Dioxane ring structure -->
  <g transform="translate(370, 540)">
    <text class="domain-sub" x="40" y="0" text-anchor="middle" fill="#D85A30">1,4-二恶烷</text>
    <polygon points="0,25 15,12 45,12 60,25 45,38 15,38" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <circle cx="0" cy="25" r="3" fill="#D85A30"/>
    <circle cx="60" cy="25" r="3" fill="#D85A30"/>
    <text class="label" fill="#D85A30" x="-5" y="46" text-anchor="middle">O</text>
    <text class="label" fill="#D85A30" x="65" y="46" text-anchor="middle">O</text>
    <!-- Attachment point -->
    <line x1="30" y1="12" x2="30" y2="0" stroke="#D85A30" stroke-width="0.5"/>
    <text class="domain-sub" x="30" y="-6" text-anchor="middle" fill="#D85A30">(S)</text>
    <text class="domain-sub" x="40" y="58" text-anchor="middle" fill="#993C1D">6元环, 2个O</text>
    <text class="domain-sub" x="40" y="72" text-anchor="middle" fill="#993C1D">连接在 C2 位 (S构型)</text>
  </g>

  <!-- Site 1 comparison -->
  <!-- Dimethyl -->
  <g transform="translate(60, 625)">
    <text class="domain-sub" x="40" y="0" text-anchor="middle" fill="#534AB7">4,4-二甲基环己烯</text>
    <polygon points="0,20 10,8 30,8 50,8 60,20 50,32 30,32 10,32" fill="#F1EFE8" stroke="#534AB7" stroke-width="0.5"/>
    <line x1="30" y1="32" x2="30" y2="42" stroke="#534AB7" stroke-width="0.5"/>
    <text class="domain-sub" x="15" y="50" text-anchor="middle" fill="#888780">CH₃</text>
    <text class="domain-sub" x="45" y="50" text-anchor="middle" fill="#888780">CH₃</text>
    <!-- Double bond -->
    <line x1="0" y1="20" x2="10" y2="8" stroke="#534AB7" stroke-width="1.5"/>
    <text class="domain-sub" x="40" y="-8" text-anchor="middle" fill="#888780">平面构象</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(280, 640)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow-right)"/>
    <text class="diff-sub" x="25" y="-8" text-anchor="middle">位点1修改</text>
  </g>

  <!-- Spiro cyclobutyl -->
  <g transform="translate(370, 620)">
    <text class="domain-sub" x="40" y="0" text-anchor="middle" fill="#D85A30">螺[环己烯-环丁烷]</text>
    <polygon points="0,20 10,8 30,8 50,8 60,20 50,32 30,32 10,32" fill="#F1EFE8" stroke="#D85A30" stroke-width="0.5"/>
    <!-- Cyclobutyl spiro -->
    <polygon points="25,32 35,22 45,22 55,32 45,42 35,42" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <!-- Double bond -->
    <line x1="0" y1="20" x2="10" y2="8" stroke="#D85A30" stroke-width="1.5"/>
    <text class="domain-sub" x="40" y="58" text-anchor="middle" fill="#993C1D">螺环增加刚性</text>
    <text class="domain-sub" x="40" y="-8" text-anchor="middle" fill="#993C1D">非平面构象</text>
  </g>
</svg>
