<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
<style>
text{font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.section{font-size:17px;font-weight:700}.nodeTitle{font-size:15px;font-weight:700}
.body{font-size:13px}.small{font-size:11.5px;fill:#5f6b7a}.tiny{font-size:10.5px;fill:#657287}
.pill{font-size:11px;font-weight:700}.edgeLabel{font-size:11.5px;font-weight:600}
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9aa8bc" flood-opacity="0.22"/></filter>
</defs>
<rect width="1400" height="920" fill="#ffffff"/>
<text x="58" y="52" class="title">Treg 在血液恶性肿瘤微环境中的募集与免疫抑制通路</text>
<text x="58" y="78" class="subtitle">泛血液肿瘤机制框架 · 从趋化浸润、表型稳定到抗肿瘤免疫失活</text>
<rect x="42" y="108" width="300" height="660" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="62" y="140" class="section">① 肿瘤微环境信号</text>
<rect x="370" y="108" width="370" height="660" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="390" y="140" class="section">② Treg 募集、扩增与稳定</text>
<rect x="768" y="108" width="590" height="660" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="788" y="140" class="section">③ Treg 介导的免疫抑制</text>
<g filter="url(#shadow)"><rect x="66" y="166" width="252" height="116" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/></g>
<rect x="66" y="166" width="7" height="116" rx="3.5" fill="#2563eb"/>
<text x="84" y="193" class="nodeTitle">恶性血液肿瘤细胞</text>
<text x="84" y="217" class="body">淋巴瘤 / 白血病 / 骨髓瘤细胞</text>
<text x="84" y="236" class="body">分泌趋化因子并重塑免疫生态</text>
<rect x="82" y="238" width="100" height="24" rx="12" fill="#dbeafe"/>
<text x="132.0" y="254" text-anchor="middle" class="pill" fill="#1d4ed8" style="fill:#1d4ed8">CCL17 / CCL22</text>
<rect x="190" y="238" width="110" height="24" rx="12" fill="#dbeafe"/>
<text x="245.0" y="254" text-anchor="middle" class="pill" fill="#1d4ed8" style="fill:#1d4ed8">CXCL12 等</text>
<g filter="url(#shadow)"><rect x="66" y="316" width="252" height="116" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/></g>
<rect x="66" y="316" width="7" height="116" rx="3.5" fill="#16a34a"/>
<text x="84" y="343" class="nodeTitle">基质细胞与血管生态位</text>
<text x="84" y="367" class="body">骨髓基质、内皮及成纤维样细胞</text>
<text x="84" y="386" class="body">提供 CXCL12、TGF-β 与存活信号</text>
<rect x="83" y="388" width="92" height="24" rx="12" fill="#dcfce7"/>
<text x="129.0" y="404" text-anchor="middle" class="pill" fill="#15803d" style="fill:#15803d">CXCL12</text>
<rect x="183" y="388" width="116" height="24" rx="12" fill="#dcfce7"/>
<text x="241.0" y="404" text-anchor="middle" class="pill" fill="#15803d" style="fill:#15803d">TGF-β / IL-10</text>
<g filter="url(#shadow)"><rect x="66" y="466" width="252" height="116" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/></g>
<rect x="66" y="466" width="7" height="116" rx="3.5" fill="#7c3aed"/>
<text x="84" y="493" class="nodeTitle">DC / 单核-髓系细胞</text>
<text x="84" y="517" class="body">抗原呈递细胞可同时提供募集与</text>
<text x="84" y="536" class="body">Treg 维持信号，形成抑制性生态位</text>
<rect x="82" y="538" width="105" height="24" rx="12" fill="#ede9fe"/>
<text x="134.5" y="554" text-anchor="middle" class="pill" fill="#6d28d9" style="fill:#6d28d9">CCL22</text>
<rect x="195" y="538" width="105" height="24" rx="12" fill="#ede9fe"/>
<text x="247.5" y="554" text-anchor="middle" class="pill" fill="#6d28d9" style="fill:#6d28d9">ICOSL</text>
<g filter="url(#shadow)"><rect x="66" y="616" width="252" height="112" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/></g>
<rect x="66" y="616" width="7" height="112" rx="3.5" fill="#ea580c"/>
<text x="84" y="643" class="nodeTitle">微环境压力</text>
<text x="84" y="667" class="body">低氧、乳酸、细胞损伤与胞外 ATP</text>
<text x="84" y="686" class="body">推动代谢适应及腺苷抑制回路</text>
<g filter="url(#shadow)"><rect x="396" y="166" width="318" height="106" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/></g>
<rect x="396" y="166" width="7" height="106" rx="3.5" fill="#7c3aed"/>
<text x="414" y="193" class="nodeTitle">趋化募集 / 组织归巢</text>
<text x="414" y="217" class="body">CCR4 ← CCL17 / CCL22（HL、EBV⁺淋巴瘤突出）</text>
<text x="414" y="236" class="body">CXCR4 ← CXCL12（骨髓生态位相关）</text>
<g filter="url(#shadow)"><rect x="396" y="306" width="318" height="112" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/></g>
<rect x="396" y="306" width="7" height="112" rx="3.5" fill="#7c3aed"/>
<text x="414" y="333" class="nodeTitle">扩增与表型稳定</text>
<text x="414" y="357" class="body">CD25 捕获 IL-2 · ICOS–ICOSL 共刺激</text>
<text x="414" y="376" class="body">TGF-β / STAT5 信号维持 FOXP3 程序</text>
<g filter="url(#shadow)">
<rect x="420" y="462" width="270" height="188" rx="26" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
</g>
<circle cx="472" cy="524" r="30" fill="#ede9fe"/>
<path d="M456 526 C462 508 482 508 488 526 M463 532 C470 540 478 540 485 532" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
<text x="520" y="510" class="nodeTitle" style="fill:#ffffff;font-size:20px">浸润性 / 活化 Treg</text>
<text x="520" y="536" class="body" style="fill:#f5f3ff">CD4⁺ · CD25 high · FOXP3⁺</text>
<rect x="447" y="568" width="68" height="24" rx="12" fill="#ede9fe"/>
<text x="481.0" y="584" text-anchor="middle" class="pill" fill="#5b21b6" style="fill:#5b21b6">CTLA-4</text>
<rect x="524" y="568" width="58" height="24" rx="12" fill="#ede9fe"/>
<text x="553.0" y="584" text-anchor="middle" class="pill" fill="#5b21b6" style="fill:#5b21b6">TIGIT</text>
<rect x="591" y="568" width="70" height="24" rx="12" fill="#ede9fe"/>
<text x="626.0" y="584" text-anchor="middle" class="pill" fill="#5b21b6" style="fill:#5b21b6">CD39</text>
<rect x="468" y="605" width="72" height="24" rx="12" fill="#ede9fe"/>
<text x="504.0" y="621" text-anchor="middle" class="pill" fill="#5b21b6" style="fill:#5b21b6">ICOS</text>
<rect x="550" y="605" width="88" height="24" rx="12" fill="#ede9fe"/>
<text x="594.0" y="621" text-anchor="middle" class="pill" fill="#5b21b6" style="fill:#5b21b6">IL-10 / TGF-β</text>
<text x="555" y="676" text-anchor="middle" class="small">局部富集、功能增强与代谢适应相互强化</text>
<g filter="url(#shadow)"><rect x="792" y="166" width="252" height="170" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/></g>
<rect x="792" y="166" width="7" height="170" rx="3.5" fill="#dc2626"/>
<text x="810" y="193" class="nodeTitle">A. 抑制抗原呈递</text>
<text x="810" y="217" class="body">CTLA-4 结合 CD80 / CD86</text>
<text x="810" y="236" class="body">降低 DC 共刺激能力</text>
<text x="810" y="255" class="body">→ CD8⁺ T 细胞启动不足</text>
<rect x="812" y="294" width="212" height="24" rx="12" fill="#fee2e2"/>
<text x="918.0" y="310" text-anchor="middle" class="pill" fill="#b91c1c" style="fill:#b91c1c">CTLA-4 ⟞ CD80 / CD86</text>
<g filter="url(#shadow)"><rect x="1070" y="166" width="264" height="170" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/></g>
<rect x="1070" y="166" width="7" height="170" rx="3.5" fill="#ea580c"/>
<text x="1088" y="193" class="nodeTitle">B. 抑制性细胞因子</text>
<text x="1088" y="217" class="body">IL-10、TGF-β（及部分情境 IL-35）</text>
<text x="1088" y="236" class="body">抑制 CD8⁺ T、NK 与 DC 功能</text>
<text x="1088" y="255" class="body">并促进耐受性微环境</text>
<rect x="1092" y="294" width="220" height="24" rx="12" fill="#ffedd5"/>
<text x="1202.0" y="310" text-anchor="middle" class="pill" fill="#c2410c" style="fill:#c2410c">旁分泌 / 接触依赖抑制</text>
<g filter="url(#shadow)"><rect x="792" y="374" width="252" height="188" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/></g>
<rect x="792" y="374" width="7" height="188" rx="3.5" fill="#16a34a"/>
<text x="810" y="401" class="nodeTitle">C. 腺苷代谢检查点</text>
<text x="810" y="425" class="body">胞外 ATP → AMP → 腺苷</text>
<text x="810" y="444" class="body">CD39 与 CD73 可由不同细胞协作</text>
<text x="810" y="463" class="body">腺苷 → A2A 受体 → cAMP↑</text>
<text x="810" y="482" class="body">→ 效应细胞增殖与杀伤下降</text>
<rect x="812" y="520" width="212" height="24" rx="12" fill="#dcfce7"/>
<text x="918.0" y="536" text-anchor="middle" class="pill" fill="#15803d" style="fill:#15803d">CD39 / CD73 → A2AR</text>
<g filter="url(#shadow)"><rect x="1070" y="374" width="264" height="188" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/></g>
<rect x="1070" y="374" width="7" height="188" rx="3.5" fill="#7c3aed"/>
<text x="1088" y="401" class="nodeTitle">D. 营养竞争与直接抑制</text>
<text x="1088" y="425" class="body">高表达 CD25 消耗局部 IL-2</text>
<text x="1088" y="444" class="body">限制效应 T 细胞扩增与存活</text>
<text x="1088" y="463" class="body">部分情境：颗粒酶 / 穿孔素</text>
<text x="1088" y="482" class="body">可介导接触依赖性细胞毒作用</text>
<rect x="1092" y="520" width="220" height="24" rx="12" fill="#ede9fe"/>
<text x="1202.0" y="536" text-anchor="middle" class="pill" fill="#6d28d9" style="fill:#6d28d9">IL-2 ↓ · Teff 扩增 ↓</text>
<g filter="url(#shadow)"><rect x="930" y="614" width="264" height="114" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/></g>
<rect x="930" y="614" width="7" height="114" rx="3.5" fill="#e11d48"/>
<text x="948" y="641" class="nodeTitle">免疫效应下降</text>
<text x="948" y="665" class="body">CD8⁺ T / NK 杀伤↓ · DC 激活↓</text>
<text x="948" y="684" class="body">免疫耗竭与肿瘤耐受增强</text>
<path d="M318 224 H356 V206 H396" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M318 374 H350 V242 H396" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<path d="M318 524 H362 V354 H396" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<path d="M318 672 H350 V612 H420" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)" stroke-dasharray="7 5"/>
<path d="M555 272 V306" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<path d="M555 418 V462" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<path d="M690 500 H746 V250 H792" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<path d="M690 522 H754 V156 H1202 V166" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<path d="M690 550 H762 V468 H792" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<path d="M690 580 H746 V354 H1202 V374" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<path d="M918 336 V354 H1049 V590 H986 V614" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<path d="M1202 336 V346 H1059 V596 H1138 V614" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<path d="M918 562 V590 H1025 V614" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<path d="M1202 562 V590 H1100 V614" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<path d="M1194 690 H1376 V796 H188 V728" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-gray)" stroke-dasharray="8 6"/>
<rect x="626" y="784" width="270" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="761" y="800" text-anchor="middle" class="edgeLabel" style="fill:#64748b">正反馈：免疫逃逸 → 肿瘤负荷与抑制生态位增强</text>
<rect x="42" y="826" width="1316" height="66" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<line x1="68" y1="850" x2="104" y2="850" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="114" y="854" class="small">肿瘤来源信号</text>
<line x1="255" y1="850" x2="291" y2="850" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="301" y="854" class="small">基质 / 代谢信号</text>
<line x1="472" y1="850" x2="508" y2="850" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="518" y="854" class="small">Treg 稳定或抑制</text>
<line x1="690" y1="850" x2="726" y2="850" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="736" y="854" class="small">免疫检查点抑制</text>
<line x1="914" y1="850" x2="950" y2="850" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="960" y="854" class="small">细胞因子 / 压力</text>
<text x="68" y="878" class="tiny">范围说明：这是跨血液恶性肿瘤的综述型框架；具体趋化轴、Treg 丰度及预后意义会随 AML、HL、NHL、MM 等亚型而变化。</text>
</svg>