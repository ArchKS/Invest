troke-width="2" /><circle cx="1300" cy="660" r="8" fill="#ff0000" stroke="#cc0000" stroke-width="2" /><text x="1250" y="690" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cc3300" text-anchor="middle" font-weight="bold">BAX/BAK形成线粒体膜孔</text><text x="1250" y="710" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cc3300" text-anchor="middle" font-weight="normal">（MOMP）</text><line x1="1250" y1="730" x2="1250" y2="780" stroke="#ff0000" stroke-width="4" marker-end="url(#arrowhead_red)" /><text x="1250" y="800" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold">细胞色素c释放</text><rect x="1100" y="820" width="300" height="60" fill="#ff9966" stroke="#cc6633" stroke-width="3" rx="10" ry="10" /><text x="1250" y="850" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#663300" text-anchor="middle" font-weight="bold">Caspase级联激活</text><rect x="1110" y="910" width="280" height="80" fill="#cce6ff" stroke="#0066cc" stroke-width="3" rx="15" ry="15" /><text x="1250" y="940" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0066cc" text-anchor="middle" font-weight="bold">✅ 细胞凋亡执行</text><text x="1250" y="965" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0066cc" text-anchor="middle" font-weight="normal">癌细胞死亡</text><rect x="50" y="1050" width="450" height="120" fill="#fafafa" stroke="#333333" stroke-width="3" rx="15" ry="15" /><text x="275" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a2e" text-anchor="middle" font-weight="bold">关键机制</text><text x="275" y="1110" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">BCL-2抑制剂竞争性结合BCL-2蛋白，释放BAX/BAK</text><text x="275" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">→ 线粒体外膜通透化（MOMP）→ 细胞色素c释放 → Caspase激活 → 凋亡</text><rect x="550" y="1050" width="1000" height="120" fill="#f5f5ff" stroke="#333333" stroke-width="2" rx="15" ry="15" /><text x="1050" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a2e" text-anchor="middle" font-weight="bold">APG-2575（Lisaftoclax）特点</text><text x="1050" y="1110" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">• 新型口服BCL-2选择性抑制剂，恢复癌细胞正常凋亡过程</text><text x="1050" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">• 5天内完成剂量爬坡，无TLS，具Best-in-class潜力</text></svg>